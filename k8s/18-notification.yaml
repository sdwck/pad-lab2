apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: pad
  labels:
    app: notification-service
    project: cloudmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: notification
          image: pad-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.notification.main:app", "--host", "0.0.0.0", "--port", "8009"]
          ports:
            - containerPort: 8009
              name: http
          env:
            - name: DATA_FILE
              value: "/data/notifications.json"
          volumeMounts:
            - name: service-data
              mountPath: /data
              subPath: notification
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8009
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: service-data
          persistentVolumeClaim:
            claimName: pad-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: pad
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 8009
      targetPort: 8009
      name: http
