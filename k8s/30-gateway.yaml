apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: pad
  labels:
    app: pad-gateway
    project: cloudmart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pad-gateway
  template:
    metadata:
      labels:
        app: pad-gateway
    spec:
      containers:
        - name: gateway
          image: pad-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: pad
  labels:
    app: pad-gateway
spec:
  type: NodePort
  selector:
    app: pad-gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
