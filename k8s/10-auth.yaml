apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: pad
  labels:
    app: auth-service
    project: cloudmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: auth
          image: pad-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.auth.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: DATA_FILE
              value: "/data/auth.json"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pad-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: service-data
              mountPath: /data
              subPath: auth
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: service-data
          persistentVolumeClaim:
            claimName: pad-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: pad
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
      name: http
