apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: pad
  labels:
    app: cart-service
    project: cloudmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: cart
          image: pad-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.cart.main:app", "--host", "0.0.0.0", "--port", "8004"]
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: DATA_FILE
              value: "/data/cart.json"
          volumeMounts:
            - name: service-data
              mountPath: /data
              subPath: cart
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: service-data
          persistentVolumeClaim:
            claimName: pad-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: pad
  labels:
    app: cart-service
spec:
  type: ClusterIP
  selector:
    app: cart-service
  ports:
    - port: 8004
      targetPort: 8004
      name: http
