apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: pad
  labels:
    app: payment-service
    project: cloudmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: payment
          image: pad-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.payment.main:app", "--host", "0.0.0.0", "--port", "8006"]
          ports:
            - containerPort: 8006
              name: http
          env:
            - name: DATA_FILE
              value: "/data/payments.json"
            - name: ORDER_URL
              valueFrom:
                configMapKeyRef:
                  name: pad-config
                  key: ORDER_URL
            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: pad-config
                  key: NOTIFICATION_URL
            - name: AUDIT_URL
              valueFrom:
                configMapKeyRef:
                  name: pad-config
                  key: AUDIT_URL
            - name: PAYMENT_GATEWAY_KEY
              valueFrom:
                secretKeyRef:
                  name: pad-secrets
                  key: PAYMENT_GATEWAY_KEY
          volumeMounts:
            - name: service-data
              mountPath: /data
              subPath: payment
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: service-data
          persistentVolumeClaim:
            claimName: pad-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: pad
  labels:
    app: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 8006
      targetPort: 8006
      name: http
